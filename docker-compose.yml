x-common-env: &common-env
  ENVIRONMENT: ${ENVIRONMENT:-local}
  GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
  GCP_REGION: ${GCP_REGION:-us-central1}
  VERTEX_LOCATION: ${VERTEX_LOCATION:-us-central1}
  GEMINI_FLASH_MODEL: ${GEMINI_FLASH_MODEL:-gemini-3.5-flash}
  GEMINI_PRO_MODEL: ${GEMINI_PRO_MODEL:-gemini-3.5-pro}
  FIRESTORE_DATABASE: ${FIRESTORE_DATABASE:-(default)}
  CLOUD_SQL_INSTANCE_CONNECTION_NAME: ${CLOUD_SQL_INSTANCE_CONNECTION_NAME:-}
  CLOUD_SQL_DATABASE: ${CLOUD_SQL_DATABASE:-lantern}
  CLOUD_SQL_USER: ${CLOUD_SQL_USER:-}
  CLOUD_SQL_PASSWORD: ${CLOUD_SQL_PASSWORD:-}
  PUBSUB_TOPIC_PREFIX: ${PUBSUB_TOPIC_PREFIX:-lantern}
  PHARMACY_AGGREGATOR_BASE_URL: ${PHARMACY_AGGREGATOR_BASE_URL:-}
  PHARMACY_AGGREGATOR_API_KEY: ${PHARMACY_AGGREGATOR_API_KEY:-}
  PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
  ORCHESTRATOR_URL: http://orchestrator:8080
  PERCEPTION_URL: http://perception:8080
  CLARIFIER_URL: http://clarifier:8080
  ACTION_URL: http://action:8080
  SAFETY_ROUTER_URL: http://safety_router:8080
  MEMORY_URL: http://memory:8080
  LIVE_SESSION_GATEWAY_URL: http://live_session_gateway:8080

services:
  orchestrator:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_MODULE: services.orchestrator.main:app
    ports: ["8080:8080"]
    environment: *common-env

  perception:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_MODULE: services.perception.main:app
    ports: ["8081:8080"]
    environment: *common-env

  clarifier:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_MODULE: services.clarifier.main:app
    ports: ["8082:8080"]
    environment: *common-env

  action:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_MODULE: services.action.main:app
    ports: ["8083:8080"]
    environment: *common-env

  safety_router:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_MODULE: services.safety_router.main:app
    ports: ["8084:8080"]
    environment: *common-env

  memory:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_MODULE: services.memory.main:app
    ports: ["8085:8080"]
    environment: *common-env

  live_session_gateway:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_MODULE: services.live_session_gateway.main:app
    ports: ["8086:8080"]
    environment: *common-env
